services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zapdesk
      POSTGRES_PASSWORD: zapdesk
      POSTGRES_DB: zapdesk
    ports:
      - "5432:5432"
    volumes:
      - zapdesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: dev
      PORT: "8080"
      DATABASE_URL: postgres://zapdesk:zapdesk@postgres:5432/zapdesk?sslmode=disable
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8080:8080"

volumes:
  zapdesk_pg:
