<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HotZap — atendimento por WhatsApp para empresas.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HotZap">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon (v2: logo do HotZap) -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>HotZap</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Embedded Signup da Meta (onboarding self-service). Inerte até ser chamado
       pelo app; carrega o SDK sob demanda e devolve code + IDs do número. -->
  <script>
  window.zapEmbeddedSignup = function (appId, configId, graphVersion) {
    return new Promise(function (resolve, reject) {
      var session = {};
      function onMessage(event) {
        try {
          if ((event.origin || '').indexOf('facebook.com') === -1) return;
          var data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
          if (data && data.type === 'WA_EMBEDDED_SIGNUP' && data.data) session = data.data;
        } catch (e) {}
      }
      function launch() {
        window.addEventListener('message', onMessage);
        window.FB.login(function (response) {
          window.removeEventListener('message', onMessage);
          var code = response && response.authResponse && response.authResponse.code;
          if (code) {
            resolve({ code: code, waba_id: session.waba_id || '', phone_number_id: session.phone_number_id || '' });
          } else {
            resolve(null); // usuário cancelou
          }
        }, {
          config_id: configId,
          response_type: 'code',
          override_default_response_type: true,
          extras: { sessionInfoVersion: 3 }
        });
      }
      if (window.FB) { launch(); return; }
      window.fbAsyncInit = function () {
        window.FB.init({ appId: appId, autoLogAppEvents: true, xfbml: false, version: graphVersion });
        launch();
      };
      var js = document.createElement('script');
      js.async = true;
      js.src = 'https://connect.facebook.net/en_US/sdk.js';
      js.onerror = function () { reject('sdk_load_failed'); };
      document.body.appendChild(js);
    });
  };

  // Login da Meta para o Instagram. Mesmo SDK do Embedded Signup, sem o ouvinte
  // de sessão: aqui o popup devolve só o `code` — quem descobre a Página e a
  // conta do Instagram é o servidor, que é onde o token pode existir.
  window.zapFacebookLogin = function (appId, configId, graphVersion) {
    return new Promise(function (resolve, reject) {
      function launch() {
        window.FB.login(function (response) {
          var code = response && response.authResponse && response.authResponse.code;
          resolve(code ? { code: code } : null); // null = usuário cancelou
        }, {
          config_id: configId,
          response_type: 'code',
          override_default_response_type: true
        });
      }
      if (window.FB) { launch(); return; }
      window.fbAsyncInit = function () {
        window.FB.init({ appId: appId, autoLogAppEvents: true, xfbml: false, version: graphVersion });
        launch();
      };
      var js = document.createElement('script');
      js.async = true;
      js.src = 'https://connect.facebook.net/en_US/sdk.js';
      js.onerror = function () { reject('sdk_load_failed'); };
      document.body.appendChild(js);
    });
  };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
